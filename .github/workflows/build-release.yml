name: Build & Release

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ── Validate signing secrets ──────────────────────────────────────────────
  validate-secrets:
    name: Validate signing secrets
    runs-on: ubuntu-latest
    outputs:
      has_keystore: ${{ steps.check.outputs.has_keystore }}
    steps:
      - name: Check all signing secrets present
        id: check
        env:
          KEYSTORE: ${{ secrets.AZKURA_AUTH_RELEASE_STORE_BASE64 }}
          STORE_PW: ${{ secrets.AZKURA_AUTH_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AZKURA_AUTH_RELEASE_KEY_ALIAS }}
          KEY_PW: ${{ secrets.AZKURA_AUTH_RELEASE_KEY_PASSWORD }}
        run: |
          MISSING=""
          [ -z "$KEYSTORE" ] && MISSING="$MISSING AZKURA_AUTH_RELEASE_STORE_BASE64"
          [ -z "$STORE_PW" ] && MISSING="$MISSING AZKURA_AUTH_RELEASE_STORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && MISSING="$MISSING AZKURA_AUTH_RELEASE_KEY_ALIAS"
          [ -z "$KEY_PW" ] && MISSING="$MISSING AZKURA_AUTH_RELEASE_KEY_PASSWORD"

          if [ -n "$MISSING" ]; then
            echo "::warning::Release signing secrets missing:$MISSING"
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          else
            echo "All signing secrets present ✅"
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          fi

  # ── Debug build (always runs) ─────────────────────────────────────────────
  build-debug:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: azkura-auth-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # ── Signed release build ──────────────────────────────────────────────────
  build-release:
    name: Signed Release (AAB + APK)
    needs: validate-secrets
    if: needs.validate-secrets.outputs.has_keystore == 'true'
    runs-on: ubuntu-latest
    env:
      AZKURA_AUTH_RELEASE_STORE_FILE: azkura-auth-release.jks
      AZKURA_AUTH_RELEASE_STORE_PASSWORD: ${{ secrets.AZKURA_AUTH_RELEASE_STORE_PASSWORD }}
      AZKURA_AUTH_RELEASE_KEY_ALIAS: ${{ secrets.AZKURA_AUTH_RELEASE_KEY_ALIAS }}
      AZKURA_AUTH_RELEASE_KEY_PASSWORD: ${{ secrets.AZKURA_AUTH_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.AZKURA_AUTH_RELEASE_STORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > azkura-auth-release.jks
          # Validate keystore and print fingerprints
          keytool -list -v \
            -keystore azkura-auth-release.jks \
            -storepass "$AZKURA_AUTH_RELEASE_STORE_PASSWORD" \
            -alias "$AZKURA_AUTH_RELEASE_KEY_ALIAS" 2>/dev/null \
            | grep -E "Alias name|SHA1:|SHA256:" || echo "⚠ Could not read fingerprints"

      - name: Build signed Release AAB
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Build signed Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::No release APK found to verify"
            exit 1
          fi

          # apksigner lives under the Android SDK build-tools dir, not on PATH
          # by default on GitHub-hosted runners — locate the newest version
          # instead of assuming it's already resolvable.
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools"
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"
          echo "✅ APK signature verified ($APKSIGNER)"

      - name: Upload Release AAB
        uses: actions/upload-artifact@v5
        with:
          name: azkura-auth-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 90

      - name: Upload Release APK
        uses: actions/upload-artifact@v5
        with:
          name: azkura-auth-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

  # ── GitHub Release (on version tags) ──────────────────────────────────────
  publish:
    name: Publish GitHub Release
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v5
        with:
          name: azkura-auth-release-apk

      - name: Download AAB artifact
        uses: actions/download-artifact@v5
        with:
          name: azkura-auth-release-aab

      - name: Rename APK for release
        run: |
          APK=$(find . -name "*.apk" | head -n1)
          VERSION="${GITHUB_REF_NAME}"
          cp "$APK" "azkura-auth-${VERSION}-release.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Azkura Auth ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          files: |
            azkura-auth-*-release.apk
            app/build/outputs/bundle/release/*.aab
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
