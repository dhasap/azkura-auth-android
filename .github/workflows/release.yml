name: Build & Release APK

# Builds a signed release APK and publishes it to a GitHub Release.
#
# Triggered by pushing a version tag (e.g. v2.10.0) or manually via the
# "Run workflow" button. Signing credentials are provided through repository
# secrets so no keystore ever lives in the repository:
#   - AZKURA_AUTH_RELEASE_STORE_BASE64   (base64 of the .jks keystore)
#   - AZKURA_AUTH_RELEASE_STORE_PASSWORD
#   - AZKURA_AUTH_RELEASE_KEY_ALIAS
#   - AZKURA_AUTH_RELEASE_KEY_PASSWORD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.AZKURA_AUTH_RELEASE_STORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::AZKURA_AUTH_RELEASE_STORE_BASE64 secret is not set."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/azkura-auth-release.jks"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build signed release APK
        env:
          AZKURA_AUTH_RELEASE_STORE_FILE: azkura-auth-release.jks
          AZKURA_AUTH_RELEASE_STORE_PASSWORD: ${{ secrets.AZKURA_AUTH_RELEASE_STORE_PASSWORD }}
          AZKURA_AUTH_RELEASE_KEY_ALIAS: ${{ secrets.AZKURA_AUTH_RELEASE_KEY_ALIAS }}
          AZKURA_AUTH_RELEASE_KEY_PASSWORD: ${{ secrets.AZKURA_AUTH_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify signature & collect metadata
        id: apkmeta
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/35.0.0)
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          echo "Found APK: $APK"
          "$BT/apksigner" verify --verbose "$APK"
          VERSION_NAME=$("$BT/aapt" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          DEST="azkura-auth-v${VERSION_NAME}-release.apk"
          cp "$APK" "$DEST"
          echo "apk_path=$DEST" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: azkura-auth-release-apk
          path: ${{ steps.apkmeta.outputs.apk_path }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Azkura Auth ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: ${{ steps.apkmeta.outputs.apk_path }}
          fail_on_unmatched_files: true
